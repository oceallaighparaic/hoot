{% macro field_errors(f) %}
    {% for e in f.errors %}
        {{ e }}
    {% endfor %}
{% endmacro %}

{% macro create_field(f, label=True, placeholder="") %}
    {% if label %}
        {{ f.label }}
    {% endif %}
    {{ f(placeholder=placeholder) }}
    {% for e in f.errors %}
        {{ e }}
    {% endfor %}
{% endmacro %}
