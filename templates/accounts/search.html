{% extends "base.html" %}

{% block header %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/search.css') }}" />
{% endblock %}

{% block main_content %}
    <main>
        {% for r in query %}
        <section>
            {% for u in r %}
                <a href="{{ url_for('P_user', username=u) }}">{{ u }}</a>
            {% endfor %}
        </section>
        {% endfor %} 
    </main>
{% endblock %}
